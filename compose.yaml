services:
  server:
    build: 
      context: server/proyecto-fin-de-grado
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    depends_on:
      - database
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://database:3306/mhcdatabase
    volumes:
      - ./server/proyecto-fin-de-grado:/app
    command: "mvn spring-boot:run"
  
  client:
    build:
      context: client
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - server
    volumes:
      - ./client:/app
      - /app/node_modules
    command: "npm run dev"

  database:
    container_name: mhc_db
    image: mysql:latest
    ports:
      - "3300:3306"
    environment:
      MYSQL_DATABASE: mhcdatabase
      MYSQL_USER: callicoder
      MYSQL_PASSWORD: callicoder
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - database:/var/lib/mysql
  
volumes:
  database:

